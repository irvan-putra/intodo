name: built-in demo preservation check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.10'}
      - name: Check bundled demo, migration, real-save and native renders
        run: ./gradlew testDebugUnitTest --no-daemon --tests 'com.vanipy.tindak.BuiltInDemo*' --tests 'com.vanipy.tindak.DualFeed*' --tests 'com.vanipy.tindak.ReminderLinks*'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: builtin-demo-evidence
          path: |
            /tmp/builtin-*.png
            /tmp/dual-*.png
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: error
