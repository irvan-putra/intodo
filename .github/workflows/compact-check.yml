name: compact-widget-check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compact:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
      - name: Verify compact and existing RemoteViews
        run: ./gradlew testDebugUnitTest --no-daemon --tests 'com.vanipy.intodo.WidgetCompactTest' --tests 'com.vanipy.intodo.WidgetRemoteApplyTest'
      - name: Build debug-only host fixture (not a signed public release)
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: itdapk-compact-host-fixture
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/test-results/testDebugUnitTest/
          retention-days: 7
          if-no-files-found: error
