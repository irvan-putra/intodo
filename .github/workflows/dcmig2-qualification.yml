name: intodo dcmig2 Android Qualification

on:
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: intodo-dcmig2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'

      - name: Install host migration-test dependency
        run: python -m pip install --disable-pip-version-check cryptography

      - name: Run migration desktop tests
        if: always()
        working-directory: app/src/main/python
        run: python -m unittest -v test_migration

      - name: Run Android JVM tests
        if: always()
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble debug APK
        if: always()
        run: ./gradlew --no-daemon assembleDebug

      - name: Assert debug APK package identity
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          test -n "$AAPT"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.instinct.widget'"

      - name: Collect rendered test screenshots
        if: always()
        shell: bash
        run: |
          mkdir -p app/build/qualification-diagnostics/screenshots
          shopt -s nullglob
          files=(/tmp/intodo-*.png /tmp/integ-bot-*.png)
          if ((${#files[@]})); then cp "${files[@]}" app/build/qualification-diagnostics/screenshots/; fi

      - name: Upload test reports and screenshots even when tests fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intodo-dcmig2-qualification-${{ github.sha }}
          path: |
            app/build/test-results/testDebugUnitTest/**/*.xml
            app/build/reports/tests/testDebugUnitTest/**
            app/build/qualification-diagnostics/**
          if-no-files-found: warn
          retention-days: 5
