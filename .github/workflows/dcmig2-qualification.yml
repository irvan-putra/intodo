name: intodo dcmig2 Android Qualification

on:
  workflow_dispatch:
  push:
    # The separate-install candidate has its own bounded build workflow.
    branches-ignore: [qualification/intodo-phone-smoke]

permissions:
  contents: read

concurrency:
  group: intodo-dcmig2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'

      - name: Install host migration-test dependency
        run: python -m pip install --disable-pip-version-check cryptography

      - name: Prepare qualification diagnostics
        if: always()
        run: mkdir -p app/build/qualification-diagnostics

      - name: Run migration desktop tests
        if: always()
        working-directory: app/src/main/python
        run: python -m unittest -v test_migration 2>&1 | tee ../../../build/qualification-diagnostics/migration-python.log

      - name: Run Android JVM tests
        if: always()
        shell: bash
        run: |
          cat > /tmp/intodo-test-logging.gradle <<'GRADLE'
          import org.gradle.api.tasks.testing.Test
          allprojects {
            afterEvaluate {
              tasks.withType(Test).configureEach {
                testLogging {
                  events "started", "passed", "skipped", "failed"
                  exceptionFormat "full"
                  showStandardStreams = true
                }
              }
            }
          }
          GRADLE
          ./gradlew --no-daemon --console=plain -I /tmp/intodo-test-logging.gradle testDebugUnitTest 2>&1 | tee app/build/qualification-diagnostics/testDebugUnitTest.log

      - name: Assemble debug APK
        if: always()
        run: ./gradlew --no-daemon assembleDebug

      - name: Assert debug APK package identity
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          test -n "$AAPT"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.instinct.widget'"

      - name: Collect rendered test screenshots
        if: always()
        shell: bash
        run: |
          mkdir -p app/build/qualification-diagnostics/screenshots
          shopt -s nullglob
          # Migration UI pixels are local-only, even with fixture data.
          # Never add /tmp/mig/render-out to this collection or uploads.
          files=(/tmp/intodo-*.png /tmp/integ-bot-*.png)
          if ((${#files[@]})); then cp "${files[@]}" app/build/qualification-diagnostics/screenshots/; fi

      - name: Remove local-only migration UI pixels
        if: always()
        shell: bash
        run: |
          rm -f /tmp/mig/render-out/bot-setup-screen.png \
            /tmp/mig/render-out/export-0-confirm.png \
            /tmp/mig/render-out/export-1-transfer-code.png \
            /tmp/mig/render-out/export-2-save-step.png \
            /tmp/mig/render-out/export-3-bundle-saved.png \
            /tmp/mig/render-out/export-failed.png \
            /tmp/mig/render-out/import-0-intro.png \
            /tmp/mig/render-out/import-1-code-entry.png \
            /tmp/mig/render-out/main-post-import.png

      - name: Upload test reports and screenshots even when tests fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intodo-dcmig2-qualification-${{ github.sha }}
          path: |
            app/build/test-results/testDebugUnitTest/**/*.xml
            app/build/reports/tests/testDebugUnitTest/**
            app/build/qualification-diagnostics/**
          if-no-files-found: warn
          retention-days: 5
