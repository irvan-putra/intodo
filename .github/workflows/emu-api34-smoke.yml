# Fixture-only comparison smoke: same Intodo 2.69.0 client/core as the API30
# qualification, but API34 google_apis x86_64. This intentionally runs only
# the short core/fixture-seed smoke, not export/import or account provisioning.
name: emu-api34-smoke
on:
  push:
    branches:
      - qualification/intodo-dcmig2-v5.21-api34-diag
permissions:
  contents: read
concurrency:
  group: emu-api34-smoke
  cancel-in-progress: true
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'
      - run: pip install deltachat-rpc-server==2.69.0 deltachat-rpc-client==2.69.0 cryptography
      - run: python3 ci/emu_preflight.py
  smoke:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'
      - name: Enable KVM (documented udev rule; runner user is not in the kvm group)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify KVM acceleration
        run: |
          if [ -w /dev/kvm ]; then ls -l /dev/kvm; else echo 'FATAL: no usable /dev/kvm'; exit 1; fi
      - name: Bounded smoke on API34 google_apis x86_64
        uses: reactivecircus/android-emulator-runner@62dbb605bba737720e10b196cb4220d374026a6d # v2.33.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          emulator-boot-timeout: 900
          script: bash ci/emu_runner.sh smoke-export
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: emu-api34-smoke
          path: |
            emu-out/
            smoke-logcat.txt
            smoke-out.tar
            smoke-out.tar.stderr
            emu-capture-meta.txt
            emu-capture-tar-list.txt
            emu-capture-tar-list.stderr
            emu-capture-files.txt
            emu-capture-files.stderr
          retention-days: 14
