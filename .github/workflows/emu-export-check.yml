# INTERNAL emulator qualification: EXPORT side (old identity) - REVIEW DRAFT.
# Fixture-only: a Delta Chat account with NO configured servers (pseudo
# transport), no I/O started, no real keys - the app keeps its INTERNET
# permission and the emulator is NOT network-isolated. Produces the
# .dcmig bundle + one-time fixture code + screenshots as a run artifact
# for the emu-import-check workflow on the renamed branch.
# Manual trigger only. No secrets, no signing, no release, contents: read.
#
# SCOPE NOTES (kept explicit for the qualification report):
# - The app's core native lib ships arm64-v8a only. Prior internal
#   evidence: Denyut's Android echo ran arm64 code on API34 x86_64
#   google_apis via the image's ARM translation; Bidik stalled without
#   acceleration and ran stably with verified KVM. Custodian's checked
#   smoke route: API30 google_apis x86_64 + translation. So the leg is
#   api30/x86_64/google_apis with a host KVM check and a fast ABI
#   preflight; if the image lacks arm64 translation the run fails in
#   seconds and the custodian may re-dispatch with arch=arm64-v8a.
#   ARM guests cannot use VM acceleration on x86 hosts, so an arm64
#   fallback is SLOW and carries no completion promise.
# - The desktop preflight runs STOCK deltachat-rpc-server 2.69.0 (pinned);
#   the app bundles the encore fork build of the same core base. SQL
#   seeding + offline key-creation equivalence is ASSUMED until the
#   smoke job proves it on-device: EmuSmokeTest fails loudly at seed
#   time if this build of core rejects the fixture, never silently.
# - Desktop preflight is a fast gate only; it closes no Android proof.
name: emu-export-check
on:
  push:
    branches:
      - qualification/intodo-dcmig2-v5.21
  workflow_dispatch:
    inputs:
      arch:
        description: 'Emulator arch: x86_64 (fast, needs image ARM translation) or arm64-v8a (slow, native, no completion promise)'
        default: 'x86_64'

permissions:
  contents: read

concurrency:
  group: emu-check
  cancel-in-progress: true

jobs:
  preflight:
    # Fast desktop gate: migration.py's real export/import legs against
    # REAL core (pinned to the version the fixture was developed against).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'
      - run: pip install deltachat-rpc-server==2.69.0 deltachat-rpc-client==2.69.0 cryptography
      - run: python3 ci/emu_preflight.py

  smoke:
    # SHORT gate: KVM check -> ABI check -> install -> Chaquopy+core+seed.
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'
      - name: Verify KVM acceleration (unaccelerated x86_64 emulators stall)
        run: |
          if [ -w /dev/kvm ]; then ls -l /dev/kvm; else echo 'FATAL: no usable /dev/kvm - aborting (Bidik evidence: unaccelerated x86_64 emulators stall)'; exit 1; fi
      - name: Smoke on emulator
        uses: reactivecircus/android-emulator-runner@e93c997dcab69054e999e3924af3d21c4a736e13 # v2.9.0
        with:
          api-level: 30
          target: google_apis
          arch: ${{ inputs.arch || 'x86_64' }}
          profile: Nexus 6
          emulator-boot-timeout: 900
          script: |
            abis=$(adb shell getprop ro.product.cpu.abilist | tr -d '\r')
            echo "cpu abilist: $abis"
            case "$abis" in
              *arm64-v8a*) echo "arm64-v8a supported (native or translated)";;
              *) echo "FATAL: no arm64-v8a on this image (no ARM translation) - re-dispatch with arch=arm64-v8a"; exit 2;;
            esac
            set +e
            ./gradlew :app:connectedDebugAndroidTest --no-daemon \
              -Pandroid.testInstrumentationRunnerArguments.class=com.vanipy.migtest.EmuSmokeTest
            status=$?
            adb logcat -d > smoke-logcat.txt 2>/dev/null
            adb exec-out run-as com.instinct.widget tar cf - -C files emu-out > smoke-out.tar 2>/dev/null
            tar xf smoke-out.tar 2>/dev/null
            ls -laR emu-out 2>/dev/null
            exit $status
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: emu-export-smoke
          path: |
            emu-out/
            smoke-logcat.txt
          retention-days: 14

  emu-export:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'
      - name: Verify KVM acceleration
        run: |
          if [ -w /dev/kvm ]; then ls -l /dev/kvm; else echo 'FATAL: no usable /dev/kvm'; exit 1; fi
      - name: Fixture export on emulator
        uses: reactivecircus/android-emulator-runner@e93c997dcab69054e999e3924af3d21c4a736e13 # v2.9.0
        with:
          api-level: 30
          target: google_apis
          arch: ${{ inputs.arch || 'x86_64' }}
          profile: Nexus 6
          emulator-boot-timeout: 900
          script: |
            abis=$(adb shell getprop ro.product.cpu.abilist | tr -d '\r')
            echo "cpu abilist: $abis"
            case "$abis" in
              *arm64-v8a*) :;;
              *) echo "FATAL: no arm64-v8a on this image - re-dispatch with arch=arm64-v8a"; exit 2;;
            esac
            set +e
            ./gradlew :app:connectedDebugAndroidTest --no-daemon \
              -Pandroid.testInstrumentationRunnerArguments.class=com.vanipy.migtest.MigrationEmuExportTest
            status=$?
            adb logcat -d > emu-logcat.txt 2>/dev/null
            adb exec-out run-as com.instinct.widget tar cf - -C files emu-out > emu-out.tar 2>/dev/null
            tar xf emu-out.tar 2>/dev/null
            ls -laR emu-out 2>/dev/null
            exit $status
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: emu-export
          path: |
            emu-out/
            emu-logcat.txt
          retention-days: 14
