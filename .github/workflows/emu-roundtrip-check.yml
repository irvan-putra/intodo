# INTERNAL emulator qualification: EXPORT + IMPORT ROUND TRIP - REVIEW DRAFT.
#
# ONE API34 google_apis x86_64 emulator session: the old identity
# (com.instinct.widget) runs the short core/fixture smoke gate, then the
# REAL export path (button -> service export mode -> migration.py
# export_migration under Chaquopy with the real core); the renamed
# identity (com.vanipy.intodo, built from the SAME tree with
# -PemuAppId) then runs the REAL import transaction core
# (withImportAdmission -> import_prepare -> StagedPrefsApplier ->
# import_commit) on the produced bundle + one-time code. Afterwards the
# harness verifies the old identity's data with BOUNDED checks (stable
# fixture markers + expected file presence, never volatile DB bytes).
#
# Fixture-only: the Delta Chat account has NO configured servers
# (pseudo transport mirroring core's own add_pseudo_transport) and no
# I/O is started. QEMU `-nic none` stays as incidental surface reduction,
# but has no proven isolation effect on this emulator: prior evidence
# showed eth0/wlan0 with addresses and per-device policy routes. The
# actual control is a root-verified first-match OUTPUT filter in both
# iptables families (accept lo, drop non-lo), installed and checked
# before any app leg. Rule order is rechecked after each leg and at
# closeout. Controlled IPv4 and IPv6 probes require the respective DROP
# packet counter to increase; an unrouteable family fails closed and is
# not reported as counter proof. Loopback must remain functional. This
# proves only fixture migration work behind observed AF_INET/AF_INET6
# guest OUTPUT drops; it does not prove NIC/backend absence or block
# non-IP raw sockets. The app keeps INTERNET permission to preserve its
# loopback RPC behavior. See ci/emu_runner.sh (roundtrip).
#
# PUBLIC-REPO ARTIFACT POLICY: uploads are an ALLOWLIST of the
# harness's own self-authored outputs with known nonsecret fields -
# success/assertion JSON, directory listings (names+sizes only),
# isolation metadata, bounded old-app marker counts. NO raw logs of
# any kind are uploaded or echoed (logcat, instrumentation/JUnit
# output): a failure trace can carry app text and redaction cannot be
# fail-closed while the one-time code is unknown, so raw output gates
# the JUnit summary runner-locally and is wiped. The .dcmig bundle,
# the one-time transfer code, EXPORT_RESULT, bot.log, screenshots
# (the export dialog shot shows the code) and any raw app archive are
# NEVER uploaded or logged: the code is secret by design, fixture or
# not. The handoff copy is runner-local and wiped before the job
# ends. Native-crash evidence is RPC liveness plus the JUnit gates;
# no logcat/tombstone claim is made.
#
# Manual trigger preferred; push trigger limited to the round-trip
# qualification branch. ONE diagnostic run per dispatch, not a
# stability loop. The unresolved prior SIGABRT (translated librpcsrv)
# and API30 compatibility stay open regardless of this run's outcome.
# contents: read; no signing, no release, no production mutation.
name: emu-roundtrip-check
on:
  workflow_dispatch:
  push:
    branches:
      - qualification/intodo-dcmig2-roundtrip

permissions:
  contents: read

concurrency:
  group: emu-roundtrip
  cancel-in-progress: true

jobs:
  preflight:
    # Fast desktop gate: migration.py's real export/import legs against
    # REAL core (pinned to the version the fixture was developed against).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'
      - run: pip install deltachat-rpc-server==2.69.0 deltachat-rpc-client==2.69.0 cryptography
      - run: python3 ci/emu_preflight.py

  roundtrip:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'
      - name: Test isolation evidence parsers and fail-closed cases
        run: python3 ci/test_emu_rt_validate.py
      - name: Test stage-6 state archive validation fixtures
        run: python3 ci/test_stage6_state_archive.py
      - name: Enable KVM (documented udev rule; runner user is not in the kvm group)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify KVM acceleration (unaccelerated x86_64 emulators stall)
        run: |
          if [ -w /dev/kvm ]; then ls -l /dev/kvm; else echo 'FATAL: no usable /dev/kvm - aborting'; exit 1; fi
      - name: Fixture export+import round trip on API34 google_apis x86_64
        uses: reactivecircus/android-emulator-runner@62dbb605bba737720e10b196cb4220d374026a6d # v2.33.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          emulator-boot-timeout: 900
          # QEMU `-nic none` is kept as harmless surface reduction but
          # has NO proven effect on this emulator's network (run
          # 43713588792: eth0/wlan0 still provisioned with addresses +
          # per-device routes); isolation is ENFORCED by a first-match
          # guest iptables/ip6tables egress drop installed and verified
          # fail-closed by the runner (see verify_guest_offline).
          # `-qemu` passes the rest to QEMU verbatim and MUST be last;
          # the pinned action appends nothing after emulator-options
          # (verified: emulator -port P -avd A <emulator-options> &).
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -qemu -nic none
          script: bash ci/emu_runner.sh roundtrip
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: emu-roundtrip
          # ALLOWLIST ONLY (self-authored, known nonsecret fields):
          # assertion/success JSON + listings under capture/, harness
          # status meta, incremental pre-test step statuses, isolation
          # evidence, bounded old-app checks.
          # No raw logs, no bundle/code/EXPORT_RESULT/bot.log/
          # screenshots, no raw archives - see the policy above.
          path: |
            capture/
            emu-rt-meta.txt
            emu-rt-pretest.txt
            emu-rt-isolation.txt
            old-app-pm-path.txt
            old-app-files-after.txt
          retention-days: 14
