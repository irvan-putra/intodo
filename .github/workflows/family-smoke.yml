name: focused tindak family widget tap
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '17'}
      - name: Download exact renamed candidate
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_RUNS: '{"tindak":{"run":44246227777,"sha":"d1170aafe2b1f709c82508e27e35d16bdb402870","artifact":"tindak-family-debug-candidate"}}'
        run: python3 tools/family-smoke/download-apks.py
      - name: Build disposable host and verify candidate package and label
        run: |
          curl -fsSL -o /tmp/g.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          echo '544c35d6bd849ae8a5ed0bcea39ba677dc40f49df7d1835561582da2009b961d  /tmp/g.zip' | sha256sum -c -
          unzip -q /tmp/g.zip -d /tmp
          /tmp/gradle-8.7/bin/gradle --no-daemon -p tools/family-smoke :app:assembleDebug
          mkdir -p host-evidence
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/aapt" dump badging host-apks/tindak.apk > host-evidence/badging.txt
          grep -F "package: name='com.vanipy.tindak'" host-evidence/badging.txt
          grep -Fx "application-label:'tindak'" host-evidence/badging.txt
          sha256sum host-apks/tindak.apk > host-evidence/apk-sha256.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          script: python3 tools/family-smoke/smoke.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tindak-family-tap-evidence
          path: host-evidence/
