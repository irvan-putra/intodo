name: phone-smoke-candidate
# Branch-scoped candidate build. Does not publish/tag a release, push main,
# install an app, or run emulator qualification. Review before pushing this
# branch: that push starts a build. No default-branch workflow registration.
on:
  push:
    branches: [qualification/intodo-phone-smoke]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phone-smoke-candidate
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'
      - name: Verify clean unconfigured source and build only the candidate
        run: |
          set -euo pipefail
          test ! -e local.properties
          python3 tools/phone-smoke/test_verify_apk.py
          ./gradlew :app:testDebugUnitTest :app:assembleRelease -PphoneSmoke --no-daemon
      - name: Fetch public signing reference (no signing secrets)
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --proto-redir '=https' \
            https://github.com/irvan-putra/intodo/releases/download/v0.5.10/itdapk-v0.5.10.apk \
            --output "$RUNNER_TEMP/reference.apk"
      - name: Sign using retained key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_PASSWORD" && test -n "$KEY_ALIAS"
          umask 077
          trap 'rm -f "$RUNNER_TEMP/smoke-ks.jks"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/smoke-ks.jks"
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          mkdir candidate
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/smoke-ks.jks" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" --out candidate/intodo-0.5.11-smoke.1.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Verify signed candidate (no signing secrets)
        run: |
          set -euo pipefail
          test -z "${KEYSTORE_BASE64+x}${KEYSTORE_PASSWORD+x}${KEY_PASSWORD+x}${KEY_ALIAS+x}"
          test ! -e "$RUNNER_TEMP/smoke-ks.jks"
          trap 'rm -f "$RUNNER_TEMP/reference.apk"' EXIT
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          python3 tools/phone-smoke/verify_apk.py "$BT/aapt" "$BT/apksigner" \
            candidate/intodo-0.5.11-smoke.1.apk "$RUNNER_TEMP/reference.apk" > candidate/SHA256SUMS
          printf 'source_commit=%s\npackage=com.vanipy.intodo\nversion=0.5.11-smoke.1\ncode=26\n' \
            "$GITHUB_SHA" > candidate/provenance.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: intodo-phone-smoke-candidate
          path: |
            candidate/intodo-0.5.11-smoke.1.apk
            candidate/SHA256SUMS
            candidate/provenance.txt
          if-no-files-found: error
          retention-days: 7
