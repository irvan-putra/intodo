# INTERNAL render-pixel check - REVIEW DRAFT, not yet active.
# Runs the Robolectric render tests (real Skia, phone-width portrait, no
# core/account/network) and uploads the PNGs as run artifacts so renders
# can be pixel-verified WITHOUT a local Android toolchain and WITHOUT any
# public push, release, tag, or artifact outside the repo's own run page.
# Manual trigger only. No secrets, no signing, contents: read.
name: render-check
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-check
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      # Chaquopy 17 builds against CPython 3.10 (see release.yml)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'
      - name: Run render tests (Robolectric native graphics)
        run: ./gradlew testDebugUnitTest --no-daemon --tests 'com.instinct.widget.bot.BotActivityRenderTest' --tests 'com.instinct.widget.bot.PublishDialogRenderTest'
      - name: Collect renders (hard-fail when an expected render is absent)
        run: |
          set -euo pipefail
          mkdir -p renders
          for f in /tmp/intodo-bot-compact.png /tmp/intodo-bot-setup-expanded.png /tmp/intodo-bot-logs-expanded.png; do
            if [ ! -f "$f" ]; then
              echo "EXPECTED RENDER MISSING: $f - the test did not produce it; failing"
              exit 1
            fi
            cp "$f" renders/
          done
          ls -la renders
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: render-pixels
          path: renders/
          retention-days: 14
          if-no-files-found: error
