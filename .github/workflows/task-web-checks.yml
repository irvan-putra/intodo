name: Browser task page checks
on:
  push:
    branches: [main]
    paths:
      - 'browser-tasks/**'
      - 'tools/release/stage-task-pages.sh'
      - '.github/workflows/task-web-checks.yml'
  pull_request:
    paths:
      - 'browser-tasks/**'
      - 'tools/release/stage-task-pages.sh'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: node --test browser-tasks/model.test.mjs
      - name: Synthetic browser actions and phone-width screenshots
        run: |
          mkdir -p "$RUNNER_TEMP/task-shots"
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium)" SHOT_DIR="$RUNNER_TEMP/task-shots" node browser-tasks/ui-check.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: task-web-synthetic-screenshots
          path: ${{ runner.temp }}/task-shots
          if-no-files-found: warn
          retention-days: 5
