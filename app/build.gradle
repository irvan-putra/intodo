plugins { id 'com.android.application'; id 'com.chaquo.python'; id 'org.jetbrains.kotlin.android' }
android {
    testOptions { unitTests { includeAndroidResources = true } }
    buildFeatures { buildConfig true }
    // Explicit opt-in test candidate. No change to the existing release identity.
    def phoneSmoke = project.hasProperty('phoneSmoke')
    if (phoneSmoke && project.hasProperty('emuAppId')) {
        throw new GradleException('phoneSmoke and emuAppId are mutually exclusive')
    }
    if (phoneSmoke) {
        sourceSets.main.res.srcDir 'src/phoneSmoke/res'
    }
    namespace 'com.instinct.widget'
    compileSdk 34
    defaultConfig {
        // Emulator qualification only: -PemuAppId=com.vanipy.intodo builds
        // the renamed-side APK from this same tree (the round-trip import
        // leg needs BOTH identities installed on one emulator). Production
        // builds never pass the property and keep the old ID.
        applicationId phoneSmoke ? 'com.vanipy.intodo' : (project.findProperty('emuAppId') ?: 'com.instinct.widget')
        // Display name follows the same identity switch: the renamed-side
        // build must not present itself under the old name (launcher,
        // foreground notification). One resource, both builds accurate.
        resValue 'string', 'app_name', (phoneSmoke || project.findProperty('emuAppId')) ? 'Intodo' : 'itdapk'
        manifestPlaceholders = [launcherIcon: phoneSmoke ? '@mipmap/ic_launcher_smoke' : '@mipmap/ic_launcher']
        minSdk 26
        targetSdk 34
        versionCode 25
        versionName '0.5.10'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        // Bot runtime (DeltaChat core) is bundled for arm64-v8a only, same
        // constraint as the scratch bot builds; librpcsrv.so exists for no
        // other ABI yet.
        ndk { abiFilters 'arm64-v8a' }
        // The personal sync endpoint is build-time config, not source: put
        // FEED_URL=https://... in local.properties (gitignored). Public source
        // builds without it and the app reports "feed URL not configured".
        def lp = new Properties()
        def lf = rootProject.file('local.properties')
        if (lf.exists()) lp.load(lf.newInputStream())
        buildConfigField 'String', 'FEED_URL', '\"' + (phoneSmoke ? '' : lp.getProperty('FEED_URL', '')) + '\"'
    }
    if (phoneSmoke) {
        defaultConfig.versionCode = 26
        defaultConfig.versionName = '0.5.11-smoke.1'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packagingOptions { jniLibs { useLegacyPackaging = true } }
}

chaquopy {
    defaultConfig {
        pip {
            // Fork of chatmail/core v2.69.0 with the missing
            // PINNED_MESSAGES_CHANGED enum entry (core emits the event since
            // 2.63.0; upstream client bindings predate it). Immutable commit
            // pin, branch fix/pinned-messages-changed on irvan-putra/encore.
            install 'deltachat-rpc-client @ git+https://github.com/irvan-putra/encore@c89d6294fea0599048f5c5b78cc1df38d3c81d3c#subdirectory=deltachat-rpc-client'
            install 'cryptography'
        }
    }
}

dependencies {
    // Emulator qualification (androidTest) - fixture-only; see
    // app/src/androidTest/java/com/vanipy/migtest/ and the emu-check workflows.
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
    androidTestImplementation 'junit:junit:4.13.2'
    implementation 'androidx.work:work-runtime:2.9.1'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.work:work-testing:2.9.1'
    testImplementation 'org.robolectric:robolectric:4.11.1'
}
