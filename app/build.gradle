plugins { id 'com.android.application' }
android {
    buildFeatures { buildConfig true }
    namespace 'com.instinct.widget'
    compileSdk 34
    defaultConfig {
        applicationId 'com.instinct.widget'
        minSdk 26
        targetSdk 34
        versionCode 8
        versionName '0.4.3'
        // The personal sync endpoint is build-time config, not source: put
        // FEED_URL=https://... in local.properties (gitignored). Public source
        // builds without it and the app reports "feed URL not configured".
        def lp = new Properties()
        def lf = rootProject.file('local.properties')
        if (lf.exists()) lp.load(lf.newInputStream())
        buildConfigField 'String', 'FEED_URL', '\"' + lp.getProperty('FEED_URL', '') + '\"'
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
