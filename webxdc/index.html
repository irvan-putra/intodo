<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instinct Shared List (prototype)</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #101828; color: #fff; }
  header { padding: 14px 16px 6px; }
  header h1 { font-size: 18px; margin: 0; }
  header .sub { color: #98A2B3; font-size: 12px; margin-top: 2px; }
  #who { color: #667085; font-size: 11px; padding: 0 16px 8px; }
  .proto { margin: 0 16px 8px; padding: 6px 10px; background: #1D2939; border-radius: 8px;
           color: #F59E0B; font-size: 11px; }
  #list { padding: 0 8px 8px; }
  .item { display: flex; align-items: flex-start; gap: 8px; padding: 10px 8px;
          border-bottom: 1px solid #1D2939; flex-wrap: wrap; }
  .item .check { background: none; border: none; color: #F59E0B; font-size: 20px; padding: 0 4px; }
  .item .body { flex: 1; min-width: 0; }
  .item .title { font-size: 15px; }
  .item.done .title { color: #667085; text-decoration: line-through; }
  .item .note { color: #98A2B3; font-size: 12px; margin-top: 2px; }
  .item .del { background: none; border: none; color: #475467; font-size: 18px; padding: 0 4px; }
  .badge { margin-top: 6px; background: #3B2F0B; color: #F59E0B; border: 1px solid #F59E0B;
           border-radius: 999px; font-size: 11px; padding: 3px 10px; }
  .trim { flex-basis: 100%; margin: 6px 0 2px; padding: 8px; background: #1D2939; border-radius: 10px; }
  .trim-field { color: #98A2B3; font-size: 11px; margin: 4px 0; }
  .branch { border-left: 3px solid #475467; padding: 6px 8px; margin: 6px 0; }
  .branch.active { border-color: #12B76A; }
  .branch.trimmed { border-color: #7A5AF8; border-style: dashed; }
  .branch-val { font-size: 14px; }
  .branch-meta { color: #667085; font-size: 11px; margin: 2px 0 4px; }
  .branch-actions button { background: #175CD3; color: #fff; border: none; border-radius: 6px;
           font-size: 12px; padding: 5px 10px; margin-right: 6px; }
  .branch-actions button + button { background: #1D2939; border: 1px solid #475467; }
  .trim.hidden { display: none; }
  .hist-toggle { background: none; border: none; color: #667085; font-size: 11px; text-decoration: underline; padding: 3px 0; margin-top: 4px; }
  .trim-hist { color: #667085; font-size: 11px; margin: 10px 0 2px; }
  .branch-val .dup { color: #667085; font-size: 11px; }
  .empty { color: #98A2B3; font-size: 13px; padding: 24px 12px; text-align: center; }
  #add { display: flex; gap: 8px; padding: 10px 12px 16px; }
  #newTitle { flex: 1; background: #1D2939; border: 1px solid #344054; border-radius: 8px;
              color: #fff; padding: 10px; font-size: 14px; }
  #addBtn { background: #F59E0B; color: #101828; border: none; border-radius: 8px;
            font-weight: 600; padding: 0 16px; }
</style>
</head>
<body>
<header>
  <h1>indeta <span style="color:#F59E0B;font-size:13px;">v0.3</span></h1>
  <div class="sub">local-first prototype - merges offline edits, you pick what survives a conflict</div>
</header>
<div class="proto">PROTOTYPE with sample data. Profiles, co-managing with friends and storage on
  other networks are design directions, not built here. The Android widget app stays separate.</div>
<div id="who"></div>
<div id="list"></div>
<div id="add">
  <input id="newTitle" type="text" placeholder="Add an item" maxlength="200">
  <button id="addBtn" onclick="addItem()">Add</button>
</div>
<script src="webxdc.js"></script>
<script src="js/mergedoc.js"></script>
<script src="js/webxdc-mock.js"></script>
<script src="js/app.js"></script>
</body>
</html>
